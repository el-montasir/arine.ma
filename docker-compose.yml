# مكتبة أرين للكتب الشرعية — PostgreSQL for the Arine backend
# Usage:
#   docker compose up -d
#   (defaults are safe for local development; override via a root .env if needed)
services:
  postgres:
    image: postgres:16-alpine
    container_name: arine_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-arine}
      POSTGRES_USER: ${POSTGRES_USER:-arine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arine_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arine} -d ${POSTGRES_DB:-arine}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: